[package]
name = "oms_bridge"
version = "1.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[[bin]]
name = "oms_bridge"

[dependencies]
rcal = { version = "3", features = ["service", "dds"], path="../rcal/rcal" }
rcal_macros = { version = "3", path="../rcal/rcal/rcal_macros" }
tokio = { version = "1", features = ["full"] }
slog = "2"
slog-term = "2"
slog-async = "2"
chrono = "0.4"

[build-dependencies]
quick-xml = "0.37"
