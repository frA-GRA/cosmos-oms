[package]
name = "oms_bridge"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "oms_bridge"

[dependencies]
rcal = { version = "3", features = ["service"] }
rcal_macros = { version = "3" }
tokio = { version = "1", features = ["full"] }
slog = "2"
slog-term = "2"
slog-async = "2"
chrono = "0.4"

[build-dependencies]
quick-xml = "0.37"
