[system]
id = "cosmos-oms-bridge"
default_transport = "oms-bus"

[system.logging]
default_level = "info"

[[system.logging.sink]]
type = "stdout"
format = "pretty"
level = "info"

[[transport]]
id = "oms-bus"
type = "dds"
## If not using the default domain
# uri = "1"

[[service]]
id = "oms_ingest"

[[service.topic]]
id = "SystemStatus"

[[service.topic]]
id = "ServiceStatus"

[[service.topic]]
id = "SubsystemStatus"
